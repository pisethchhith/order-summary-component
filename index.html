<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Order summary card</title>
</head>
<body>

  <!-- Order Summary

  You can now listen to millions of songs, audiobooks, and podcasts on any 
  device anywhere you like!

  Annual Plan
  $59.99/year

  Change

  Proceed to Payment
  Cancel Order -->
  <main class="order">
    <img src="images/illustration-hero.svg" alt="">
    <div class="wrapper">
      <h2 class="hero-header">Order Summary</h2>
      <p class="hero-info">You can now listen to millions of songs,<br>audiobooks, and podcasts on any device<br>anywhere you like!
      </p>
      <div class="preview-items">
        <div class="preview-wrapper">
          <div class="preview-icons">
            <img src="./images/icon-music.svg" alt="Music icons" >
          </div>
          <div class="preview-info">
            <p>Annual Plan</p>
            <span class="price-tags">$59.99/year</span>
          </div>
        </div>
        <a href="#" class="action-link-btn">Change</a>
      </div>
      <div class="feature-btn">
        <button class="proceed-btn" type="submit" onclick="alert('Order Placed Successfully!\nYour order has been submitted and will be completed within 7–14 working days. A confirmation email with your order details has been sent.')">Proceed to Payment</button>
        <button class="cancel-btn" onclick="alert('Order has been cancelled.')">Cancel Order</button>
      </div>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Seth.dev</a>.
  </footer>
</body>
</html>
